name: Contexts
on: workflow_dispatch
jobs:
    show:
        runs-on: ubuntu-latest
        steps:
            - name: Print contexts
              run: |
                echo "event: ${{github.event_name}}"
                echo "ref: ${{github.ref}}"
                echo "actor: ${{github.actor}}"
                echo "repo: ${{github.repository}}"
                echo "os: ${{runner.os}}"
                echo "home: $HOME"
            - name: Only on main
              if: github.ref == 'refs/heads/main'
              run: echo "this is main"
            - name: Never here
              if: github.ref == 'refs/heads/nope'
              run: echo "skipped"
        