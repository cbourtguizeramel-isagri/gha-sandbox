name: Steps
on: workflow_dispatch
jobs:
    look:
        runs-on: ubuntu-latest
        steps:
            - name: Before Checkout
              run: ls -la
            - name: Checkout
              uses: actions/checkout@v4
            - name: After Checkout
              run: |
                ls -la
                echo "I am in $(pwd)"
            - name: Set a variable
              run: export GREETING=hello
            - name: Read it back
              run: echo $GREETING