name: Env
on: workflow_dispatch
env:
  WORKFLOW_LEVEL: from-workflow
jobs: 
    show:
        runs-on: ubuntu-latest
        env:
            JOB_LEVEL: from-job
        steps:
            - name: Litteral, variable, scopes
              env: 
                  STEP_LEVEL: from-step
                  FROM_VAR: ${{vars.DEMO_VAR}}
              run: |
                echo "$WORKFLOW_LEVEL $JOB_LEVEL $STEP_LEVEL"
                echo "var: $FROM_VAR"
            - name: Secret
              env: 
                FROM_SECRET : ${{secrets.DEMO_SECRET}}
              run: |
                echo "secret: $FROM_SECRET"
                echo "length: ${#FROM_SECRET}"
            - name: Step level is gone
              run: echo "step level now is $STEP_LEVEL"